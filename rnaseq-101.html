t-numeric:tabular-nums}.counts-table th,.counts-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}.counts-table th:first-child,.counts-table td:first-child{text-align:left}.counts-table thead th{position:sticky;top:0;background:var(--white);font-weight:550}.counts-table .sel{background:var(--teal-light)}.counts-table tbody tr{cursor:pointer}.code{background:#f2f5f7;border-radius:10px;padding:18px;font:13px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;white-space:pre}.sequence{font:16px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;word-break:break-all}.seqbase{border:0;background:none;display:inline-block;padding:2px 3px;border-radius:3px;min-width:20px}.seqbase.active{background:var(--teal-light);color:var(--teal);outline:1px solid var(--teal)}.mini-card{background:var(--paper);border-radius:9px;padding:14px;margin:12px 0}.mini-card p{margin:4px 0}.unitigs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}.unitig{padding:12px 18px;background:var(--teal-light);border-radius:9px;font-family:monospace;color:var(--teal)}.metrics{display:flex;gap:24px;flex-wrap:wrap;margin:8px 0 14px}.metrics div{font-size:11px;color:var(--muted)}.metrics strong{display:block;font-size:22px;font-weight:550;color:var(--ink)}dialog{border:1px solid var(--line);border-radius:15px;max-width:760px;width:calc(100% - 32px);color:var(--ink);padding:28px;box-shadow:0 30px 100px #0002}dialog::backdrop{background:#20384270}dialog h2{font-size:23px;line-height:1.25;margin-top:0}dialog h3{font-size:15px;margin-top:22px}dialog p,dialog li{font-size:13px;color:var(--muted)}dialog li{margin-bottom:7px}.dialog-top{display:flex;justify-content:space-between;gap:15px;align-items:start}details{margin:14px 0;font-size:13px}summary{cursor:pointer;color:var(--teal)}.challenge{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0 0}.challenge span{flex:1;font-size:12px;color:var(--muted);min-width:170px}.progress-line{height:3px;background:var(--line)}.progress-line div{height:3px;background:var(--teal);transition:width .25s}.heat-cell:hover{stroke:var(--ink);stroke-width:2;cursor:pointer}.no-data{padding:75px 20px;text-align:center;color:var(--muted)}.flow-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.flow-buttons button{font-size:12px}.shake-free{animation:appear .3s ease}@keyframes appear{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:1500px){main{padding-top:42px}.visual>svg{max-height:510px}}@media(max-width:1050px){header{padding:0 22px}.layout{grid-template-columns:180px minmax(0,1fr)}aside{padding:24px 10px}main{padding:25px 20px}.split{grid-template-columns:1fr}.gene-editor{max-width:none}.editor-body{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{padding:19px}.visual{min-height:260px}}@media(max-width:700px){header{height:74px;padding:0 15px}.brand strong{font-size:18px}.badge{display:none}.top-actions{gap:6px}.top-actions button{font-size:11px;padding:7px}.layout{display:block}aside{padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}#nav{display:flex;width:max-content;gap:5px}.chapter,.sidebar-note{display:none}.step{width:auto;gap:6px;padding:8px 10px;white-space:nowrap;margin:0}.step .num{width:auto;font-size:10px}main{padding:23px 13px}.heading{align-items:start}h1{font-size:26px}.subtitle{font-size:13px}.stage{padding:14px;border-radius:12px}.visual{min-height:220px}.visual>svg{min-width:0}.controls{gap:14px}.control{min-width:120px}.footer-nav .micro{font-size:10px}.editor-body{display:block}.scene text{font-size:16px}.scene .muted{font-size:14px}.flow-buttons{grid-template-columns:repeat(2,1fr)}}

<body>
<header><div class="brand"><svg class="brandmark" viewBox="0 0 36 38" aria-hidden="true"><path d="M7 3C7 14 29 24 29 35M29 3C29 14 7 24 7 35" stroke="#177e83" stroke-width="3" fill="none"/><path d="M9 8H27M14 15H22M14 23H22M9 30H27" stroke="#98c4bd" stroke-width="2"/></svg><div><strong>RNA → insight</strong><small>A tiny sequencing lab</small></div></div><div class="top-actions"><span class="badge">Explore • change • discover</span><button class="small" data-action="notes">Guide & sources</button><button class="small" data-action="export">Export</button></div></header>
<div class="progress-line"><div id="progress"></div></div>
<div class="layout"><aside><nav id="nav" aria-label="Lesson steps"></nav><div class="sidebar-note">120 synthetic genes<br>Control × 3<br>Treatment × 3<br><br>One file. Works offline.</div></aside><main id="main"></main></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<script>
'use strict';
const C={teal:'#177e83',light:'#e4f3f1',blue:'#4e7eac',blueLight:'#e9f0f8',red:'#cd6b56',redLight:'#faece5',gray:'#a2afb6',ink:'#243c49',muted:'#607783',line:'#dbe5e7',purple:'#9175ad',gold:'#b68a35'};
const steps=[['Collect RNA','The experiment','Six biological samples. Two conditions.'],['Build a library','From RNA to cDNA','Select, fragment, copy, and add adapters.'],['Sequence','Read one base at a time','Illumina sequencing-by-synthesis · simplified.'],['Inspect FASTQ','Read + confidence','A base call is a prediction with a quality score.'],['Assembly detour','Build or map?','Explore assembly, then return to the RNA-seq route.'],['Map reads','Find where each read belongs','A splice-aware alignment can bridge an intron.'],['Count fragments','Turn alignments into a matrix','Rows = genes. Columns = biological samples.'],['Normalize','Make samples comparable','Separate relative expression from sequencing depth.'],['DESeq2 concepts','Signal versus variation','More consistent replicates give stronger evidence.'],['Volcano','Which genes changed?','Click a gene. Change its counts. Watch it move.'],['Heatmap','See the pattern','The same genes and samples, viewed together.']];
const S={step:0,visited:new Set([0]),rna:0,library:0,cycle:0,fastBase:0,trim:0,assembly:0,k:3,kpos:0,repeat:false,resolve:false,mapMode:'genome',mapped:false,read:1,counted:new Set(),effect:1.7,noise:.19,depth:1.5,normalized:true,gene:0,alpha:.05,lfc:1,heatMode:'z',heatFilter:'top',heatN:18,seed:42,overrides:{},genes:[],rows:[],factors:[],norm:[]};
const samples=['C1','C2','C3','T1','T2','T3'];
const librarySizes=[.90,1.13,1.02,1.06,.86,1];
const seq='ACGTACGATCTGACCTAGCTAGTC';
const quality=[38,37,38,37,36,37,36,35,36,35,34,35,33,32,33,31,29,28,25,21,18,14,10,7];
const letters={A:'#177e83',C:'#4e7eac',G:'#b68a35',T:'#cd6b56',U:'#cd6b56'};
const $=x=>document.querySelector(x);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const variance=a=>a.length>1?a.reduce((s,x)=>s+(x-mean(a))**2,0)/(a.length-1):0;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
const fmt=x=>x===null?'not tested':x<.001?x.toExponential(1):x.toFixed(3);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function rand(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function normal(r){return Math.sqrt(-2*Math.log(Math.max(1e-12,r())))*Math.cos(2*Math.PI*r())}
function gamma(shape,r){if(shape<1)return gamma(shape+1,r)*r()**(1/shape);const d=shape-1/3,c=1/Math.sqrt(9*d);for(;;){let x=normal(r),v=1+c*x;if(v<=0)continue;v=v**3;const u=r();if(u<1-.0331*x**4||Math.log(u)<.5*x*x+d*(1-v+Math.log(v)))return d*v}}
function poisson(mu,r){if(mu<30){let p=1,k=0,l=Math.exp(-mu);do{k++;p*=r()}while(p>l);return k-1}return Math.max(0,Math.round(mu+Math.sqrt(mu)*normal(r)))}
function regenerate(){S.genes=Array.from({length:120},(_,i)=>{const r=rand(816+i*71),base=i===119?0:i>112?1+5*r():35+1300*r()**2;const truth=i<16?S.effect*(.65+r()*.7):i<32?-S.effect*(.65+r()*.7):0;const counts=samples.map((_,j)=>{const rng=rand(S.seed+i*1777+j*131),sf=librarySizes[j]*(j===5?S.depth:1),mu=base*(j<3?1:2**truth)*sf,alpha=Math.max(.003,S.noise*S.noise);return poisson(mu*gamma(1/alpha,rng)*alpha,rng)});return{id:'gene_'+String(i+1).padStart(3,'0'),truth,base,counts:counts.map((v,j)=>S.overrides[i+':'+j]??v)}});analyze()}
function erfc(x){const z=Math.abs(x),t=1/(1+.5*z),v=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?v:2-v}
function analyze(){const eligible=S.genes.filter(g=>g.counts.every(v=>v>0));S.factors=samples.map((_,j)=>median(eligible.map(g=>g.counts[j]/Math.exp(mean(g.counts.map(Math.log))))));if(!eligible.length)S.factors=samples.map(()=>1);const center=Math.exp(mean(S.factors.map(Math.log)));S.factors=S.factors.map(x=>x/center);S.norm=S.genes.map(g=>g.counts.map((v,j)=>v/S.factors[j]));const prelim=S.norm.map(a=>{const x=a.slice(0,3),y=a.slice(3),mx=mean(x),my=mean(y);const ax=Math.max(0,(variance(x)-mx*mean(S.factors.slice(0,3).map(f=>1/f)))/Math.max(1,mx*mx));const ay=Math.max(0,(variance(y)-my*mean(S.factors.slice(3).map(f=>1/f)))/Math.max(1,my*my));return(mx>5&&my>5)?(ax+ay)/2:null});const trend=Math.max(.005,median(prelim.filter(x=>x!==null)));S.rows=S.genes.map((g,i)=>{const a=S.norm[i],mx=mean(a.slice(0,3)),my=mean(a.slice(3)),baseMean=mean(a),lfc=Math.log2((my+.5)/(mx+.5)),disp=.5*(prelim[i]??trend)+.5*trend;const se=Math.sqrt(S.factors.slice(0,3).reduce((s,f)=>s+1/f,0)/(9*Math.max(.5,mx))+S.factors.slice(3).reduce((s,f)=>s+1/f,0)/(9*Math.max(.5,my))+2*disp/3)/Math.LN2;const tested=baseMean>=5;const p=tested?clamp(erfc(Math.abs(lfc/se)/Math.SQRT2),1e-100,1):null;return{i,id:g.id,mx,my,baseMean,lfc,se,disp,p,padj:null,tested}});const sorted=S.rows.filter(r=>r.tested).sort((a,b)=>a.p-b.p);let prev=1;for(let i=sorted.length-1;i>=0;i--){prev=Math.min(prev,sorted[i].p*sorted.length/(i+1));sorted[i].padj=prev}}
const sig=r=>r.tested&&r.padj<=S.alpha&&Math.abs(r.lfc)>=S.lfc;
const geneColor=r=>!sig(r)?C.gray:r.lfc>0?C.red:C.blue;
function svg(body,w=860,h=370,label='Interactive scientific diagram'){return`<svg class="scene" role="img" aria-label="${label}" viewBox="0 0 ${w} ${h}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="${C.gray}" stroke-width="1.3"/></marker></defs>${body}</svg>`}
const txt=(x,y,t,cls='',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${t}</text>`;
const rect=(x,y,w,h,fill,rx=5,more='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${more}/>`;
const line=(x,y,x2,y2,color=C.line,extra='')=>`<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2" ${extra}/>`;
function arrow(x,y,x2,y2){return line(x,y,x2,y2,C.gray,'marker-end="url(#arrow)"')}
function rnaPath(x,y,w,color=C.teal){let p=`M${x} ${y}`;for(let j=0;j<6;j++)p+=`q${w/12} -10 ${w/6} 0`;return`<path d="${p}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`}
function strand(x,y,s,box=24,hi=-1,k=1){return s.split('').map((b,i)=>rect(x+i*box,y,box-2,29,hi<0?(letters[b]+'18'):(i>=hi&&i<hi+k?letters[b]+'36':'#f1f4f5'),4)+`<text x="${x+i*box+(box-2)/2}" y="${y+20}" text-anchor="middle" style="fill:${letters[b]}" class="mono">${b}</text>`).join('')}
function tube(x,y,color,label,fill=true){return`<g transform="translate(${x},${y})"><path d="M0 0H44V77L22 102L0 77Z" fill="#f2f7f8" stroke="${C.gray}" stroke-width="2"/>${fill?`<path d="M4 38H40V75L22 95L4 75Z" fill="${color}" opacity=".55"/>`:''}${rect(-4,-8,52,13,color,3)}${txt(22,126,label,'muted','middle')}</g>`}
function range(id,label,min,max,step,val,display=val){return`<div class="control"><label for="${id}">${label}<output id="out-${id}">${display}</output></label><input id="${id}" data-control="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></div>`}
const action=(name,text,primary=false,extra='')=>`<button data-action="${name}" class="${primary?'primary':''}" ${extra}>${text}</button>`;
function tabs(items,key,current){return`<div class="tabs">${items.map((t,i)=>`<button data-action="${key}" data-value="${i}" aria-pressed="${current===i}">${t}</button>`).join('')}</div>`}

function graphData(){const sequences=S.repeat?['ATGACCTGA','ATGATCTGA']:['ATGACCTGA'];const k=S.k,edges=new Map();for(const s of sequences)for(let i=0;i<=s.length-k;i++){const mer=s.slice(i,i+k);edges.set(mer,{mer,u:mer.slice(0,-1),v:mer.slice(1)})}const es=[...edges.values()],nodes=[...new Set(es.flatMap(e=>[e.u,e.v]))];const incoming=n=>es.filter(e=>e.v===n),outgoing=n=>es.filter(e=>e.u===n),used=new Set(),unitigs=[];function walk(e){let seq=e.mer,path=[e.mer];used.add(e.mer);let v=e.v;while(incoming(v).length===1&&outgoing(v).length===1&&!used.has(outgoing(v)[0].mer)){e=outgoing(v)[0];used.add(e.mer);path.push(e.mer);seq+=e.mer.at(-1);v=e.v}unitigs.push({seq,path})}nodes.filter(n=>incoming(n).length!==1||outgoing(n).length!==1).forEach(n=>outgoing(n).forEach(e=>{if(!used.has(e.mer))walk(e)}));es.forEach(e=>{if(!used.has(e.mer))walk(e)});return{sequences,es,nodes,incoming,outgoing,unitigs}}

function drawVolcano(){const plotted=S.rows.filter(r=>r.tested),xmax=Math.max(3,Math.ceil(Math.max(...plotted.map(r=>Math.abs(r.lfc)))+.3)),ymax=Math.max(4,Math.ceil(Math.max(...plotted.map(r=>-Math.log10(r.padj)))+1)),w=Math.max(300,Math.floor($('#visual').clientWidth)),h=402,L=63,R=w-20,T=26,B=335;const xx=x=>L+(x+xmax)/(2*xmax)*(R-L),yy=y=>B-y/ymax*(B-T);let b='';[0,.25,.5,.75,1].forEach(p=>{const y=p*ymax;b+=line(L,yy(y),R,yy(y))+txt(L-10,yy(y)+4,y.toFixed(ymax<10?1:0),'tiny','end')});[-1,-.5,0,.5,1].forEach(p=>{b+=txt(xx(p*xmax),B+23,(p*xmax).toFixed(1),'tiny','middle')});b+=line(xx(-S.lfc),T,xx(-S.lfc),B,C.gray,'stroke-dasharray="4 5"')+line(xx(S.lfc),T,xx(S.lfc),B,C.gray,'stroke-dasharray="4 5"')+line(L,yy(-Math.log10(S.alpha)),R,yy(-Math.log10(S.alpha)),C.gray,'stroke-dasharray="4 5"');for(const r of [...plotted.filter(r=>r.i!==S.gene),...plotted.filter(r=>r.i===S.gene)])b+=`<circle cx="${xx(r.lfc)}" cy="${yy(-Math.log10(r.padj))}" r="${r.i===S.gene?7:4.6}" fill="${geneColor(r)}" stroke="${r.i===S.gene?C.ink:'#fff'}" stroke-width="${r.i===S.gene?2:1}" data-gene="${r.i}"><title>${r.id}: log₂FC ${r.lfc.toFixed(2)}, adjusted P ${fmt(r.padj)}</title></circle>`;b+=txt((L+R)/2,390,'log₂ fold change · Treatment / Control','label','middle')+`<text x="17" y="180" transform="rotate(-90 17 180)" text-anchor="middle" class="label">−log₁₀ adjusted P · approximate</text>`;const cur=S.rows[S.gene];if(cur.tested)b+=txt(clamp(xx(cur.lfc),L+42,R-42),Math.max(T+12,yy(-Math.log10(cur.padj))-14),cur.id,'tiny','middle');$('#visual').innerHTML=svg(b,w,h,'Volcano plot: click near any point to select a gene');const up=S.rows.filter(r=>sig(r)&&r.lfc>0).length,down=S.rows.filter(r=>sig(r)&&r.lfc<0).length;$('#plot-caption').textContent=`${up} higher · ${down} lower · ${plotted.length} tested · ${120-plotted.length} low-count genes omitted`;insight('Right = higher expression in treatment. Up = smaller adjusted P. Thresholds filter calls; they do not change the underlying counts.');window.volcanoGeometry={xx,yy,plotted};}

function heatData(){return S.rows.filter(r=>S.heatFilter==='deg'?sig(r):r.tested).map(r=>{const a=S.norm[r.i].map(x=>Math.log2(x+1)),m=mean(a),sd=Math.sqrt(variance(a));return{...r,log:a,v:variance(a),z:a.map(x=>sd?(x-m)/sd:0)}}).sort((a,b)=>b.v-a.v).slice(0,S.heatN)}
function drawHeatmap(){const rows=heatData();if(!rows.length){$('#visual').innerHTML='<div class="no-data">No genes pass these criteria.<br>Relax a cutoff or choose “Highest variance”.</div>';$('#plot-caption').textContent='No DEG rows to display.';insight('An empty DEG heatmap can be a valid result. Changing a cutoff changes the displayed selection.');return}const w=Math.max(290,Math.floor($('#visual').clientWidth)),h=110+rows.length*24,L=86,T=58,cw=(w-L-14)/6,rh=24,max=Math.max(...rows.flatMap(r=>r.log));let b='';samples.forEach((s,j)=>{b+=rect(L+j*cw,14,cw-3,7,j<3?C.blue:C.red,1)+txt(L+j*cw+(cw-3)/2,43,s,'tiny','middle')});rows.forEach((r,i)=>{b+=txt(L-12,T+i*rh+17,r.id,'tiny','end');r[S.heatMode].forEach((v,j)=>{let c=S.heatMode==='z'?v<0?blend('#f3f5f4',C.blue,-v/2):blend('#f3f5f4',C.red,v/2):blend('#f0f7f5',C.teal,v/max);b+=rect(L+j*cw,T+i*rh,cw-3,rh-3,c,2,`class="heat-cell" data-action="select-gene" data-value="${r.i}" tabindex="0" role="button" aria-label="${r.id} ${samples[j]} value ${v.toFixed(2)}"`)});if(r.i===S.gene)b+=`<rect x="${L-2}" y="${T+i*rh-2}" width="${6*cw+1}" height="${rh+1}" fill="none" stroke="${C.ink}" stroke-width="1.5" pointer-events="none"/>`});const y=T+rows.length*rh+18;for(let t=0;t<100;t++){const c=S.heatMode==='z'?t<50?blend(C.blue,'#f3f5f4',t/50):blend('#f3f5f4',C.red,(t-50)/50):blend('#f0f7f5',C.teal,t/99);b+=rect(w/2-75+t*1.5,y,1.7,9,c,0)}b+=txt(w/2-84,y+9,S.heatMode==='z'?'−2':'0','tiny','end')+txt(w/2+85,y+9,S.heatMode==='z'?'+2':max.toFixed(1),'tiny')+txt(w/2,y+30,S.heatMode==='z'?'Within-gene Z score':'log₂(normalized count + 1)','tiny','middle');$('#visual').innerHTML=svg(b,w,h+25,'Expression heatmap; rows sorted by variance, samples in fixed order');$('#plot-caption').textContent=`${rows.length} genes · sorted by variance · samples in fixed order`;insight(S.heatMode==='z'?'Each row is centered and scaled separately. Color compares samples within a gene; it does not compare abundance between genes.':'This scale compares transformed abundance across genes and samples. Log transformation is for display; DESeq2 tests the original counts.');}
function showDialog(title,body){$('#dialog-content').innerHTML=`<div class="dialog-top"><h2>${title}</h2><button class="small" data-action="close" aria-label="Close dialog">✕</button></div>${body}`;$('#dialog').showModal()}
const why=[
'Biological replicates capture variation between independent samples. Splitting one RNA extraction into several tubes gives technical replicates. Randomize sample processing and avoid confounding condition with batch. Check RNA integrity, purity, and DNA contamination before library preparation.',
'This lesson shows one poly(A)-enrichment workflow. Other protocols use rRNA depletion, different fragmentation order, or full-length libraries. Strand-specific preparation preserves information about the RNA strand of origin. Here, the library diagram is intentionally simplified.',
'A flow-cell cluster contains amplified copies of a library molecule. Repeated incorporation and imaging produce base calls. Paired-end sequencing reads both ends of a fragment; an unsequenced interval may remain between the reads. Read length and fragment length are different quantities.',
'Phred quality is Q = −10 log₁₀(error probability). Q20 corresponds to 1% error probability; Q30 to 0.1%. FASTQ encodes each quality as a character, commonly Phred+33. Assess adapters, sequence composition, duplication, and per-base quality. Trimming decisions depend on the actual data.',
'The linked Heng Li demo uses an overlap graph, in which reads are vertices. This detour uses a de Bruijn graph: (k−1)-mers are vertices and k-mers are edges. Both can be compacted into unitigs, but they are distinct graph constructions. Repeats and incomplete coverage prevent guaranteed reconstruction. RNA-seq can assemble expressed transcripts, not complete chromosomes. In organisms with a reference, conventional RNA-seq often maps directly to that reference.',
'A splice-aware genome aligner can map one read across two exons, recording the skipped intron with N in the CIGAR string. M consumes both read and reference positions and need not imply every position is an exact match. The illustrative alignment begins at position 136: 15 reference bases, a 100-base intron, then 15 more. SAM is readable text; BAM is binary. A BAM index supports coordinate-based access. Mapping quality and base quality are different confidence measures.',
'Quantification combines alignments with gene annotations and an explicit assignment policy. Paired reads usually represent one sequenced fragment. Multimapping, overlapping genes, strandedness, and exon boundaries affect assignment. This eight-fragment sketch is separate from the 120-gene synthetic dataset; it is not a full count-generation pipeline.',
'The demo calculates a geometric mean for each gene with nonzero counts in all samples, then takes each sample’s median ratio to those means and centers size factors to geometric mean one. Most genes are simulated unchanged. Relative normalization cannot identify a global RNA increase without additional information such as suitable spike-ins. Do not feed TPM, row Z scores, or normalized counts to DESeqDataSetFromMatrix.',
'Live statistics are an educational approximation, not a JavaScript implementation of DESeq2. For each gene, the demo estimates group means after size-factor normalization, a method-of-moments dispersion from within-group variation, and blends that dispersion equally with the across-gene median. A delta-method standard error gives an approximate two-sided Wald P value. Genes with mean normalized count below 5 are excluded; Benjamini–Hochberg adjustment covers the remaining tests. Fold change uses a 0.5 pseudocount. There is no fitted dispersion trend, Cook’s distance filtering, independent filtering optimization, or fold-change shrinkage. The exported R script runs actual DESeq2 on the current raw counts, so its results will differ.',
'The x-axis is log₂(Treatment / Control). A value of +1 corresponds approximately to twice the normalized expression; −1 to half. The y-axis uses adjusted P, not raw P. BH adjustment addresses multiple testing. An adjusted P threshold controls an expected false-discovery proportion under the method’s assumptions; it is not the probability that an individual gene is false. The fold-change cutoff is a separate display filter, not a test of effect size above that cutoff.',
'This heatmap uses log₂(normalized count + 1), optionally standardized to mean zero and sample standard deviation one within each gene. Colors are clipped at Z = ±2. Rows are the 18 highest-variance tested genes, or the 18 highest-variance genes passing the selected DEG criteria. Samples keep their fixed order; no clustering is implied. Real workflows commonly use a variance-stabilizing transform and inspect PCA and batch effects before interpretation.'
];
function notes(){showDialog('A short teaching guide',`<p>Click the numbered steps. Every example is synthetic; no gene effect is a biological finding.</p><h3>Three experiments to try</h3><ol><li><b>Assembly:</b> change k, then inspect the graph and its unitigs.</li><li><b>Normalization:</b> increase T3 depth; compare raw and normalized bars.</li><li><b>DEGs:</b> drag a replicate bar, change thresholds, then open the heatmap.</li></ol><h3>What is connected?</h3><p>Steps 1–7 are small conceptual sketches. Steps 8–11 share one 120-gene × 6-sample count matrix. Counts, size factors, approximate statistics, volcano, and heatmap update together. Global dataset controls regenerate the simulation; manually edited counts are retained until reset.</p><h3>Keep these distinctions</h3><p>Genome assembly is an optional detour. A reference-based RNA-seq experiment does not build chromosomes before mapping. The live test illustrates statistical ideas; export counts and the R script for real DESeq2.</p><details><summary>Simulation and model details</summary><p>Seeded gamma–Poisson sampling provides overdispersed integer counts; large Poisson means use a normal approximation. Six sample depth multipliers vary; 16 genes have a positive simulated effect, 16 a negative effect, and the remainder no imposed condition effect. Six genes are very low-count and one is silent. “Replicate variability” sets the gamma component’s coefficient of variation. Manual edits are capped at 50,000 counts per sample.</p><p>${why[8]}</p></details><h3>Primary references & inspiration</h3><ul><li><a href="https://lh3.github.io/teach-demo/ovasm.html" target="_blank" rel="noopener">Heng Li · Overlap graph assembly demo</a> — interaction inspiration; this file uses original diagrams and code.</li><li><a href="https://www.illumina.com/science/technology/next-generation-sequencing/beginners/ngs-workflow.html" target="_blank" rel="noopener">Illumina · NGS workflow</a></li><li><a href="https://samtools.github.io/hts-specs/SAMv1.pdf" target="_blank" rel="noopener">SAM/BAM format specification</a></li><li><a href="https://bioconductor.org/packages/release/bioc/vignettes/DESeq2/inst/doc/DESeq2.html" target="_blank" rel="noopener">DESeq2 · Bioconductor workflow</a></li><li><a href="https://doi.org/10.1186/s13059-014-0550-8" target="_blank" rel="noopener">Love, Huber & Anders (2014) · DESeq2</a></li></ul><p>All illustrations are original schematic drawings. No BioRender assets or affiliation. Sources checked September 2026.</p>`)}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportDialog(){showDialog('Take the experiment with you',`<p>Exports use your current counts, including manual edits.</p><div class="control-actions">${action('csv','Counts CSV',true)}${action('metadata','Sample metadata')}${action('results','Approximate results')}${action('rscript','Real DESeq2 · R script')}</div><p>Save the counts, metadata, and R script in one folder. Run the script in R with DESeq2 installed. The script produces actual DESeq2 results and a PDF of plots; these will differ from the live approximation.</p>`)}
function rScript(){return`# RNA to insight: run actual DESeq2 on the exported synthetic counts.
# Save mock_counts.csv and mock_samples.csv in your R working directory.
# Install once if needed:
# if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
# BiocManager::install("DESeq2")
suppressPackageStartupMessages(library(DESeq2))
cts <- as.matrix(read.csv("mock_counts.csv", row.names = 1, check.names = FALSE))
meta <- read.csv("mock_samples.csv", row.names = 1)
meta <- meta[colnames(cts), , drop = FALSE]
stopifnot(identical(rownames(meta), colnames(cts)), all(cts >= 0), all(cts == round(cts)))
storage.mode(cts) <- "integer"
meta$condition <- factor(meta$condition, levels = c("Control", "Treatment"))
dds <- DESeqDataSetFromMatrix(cts, meta, design = ~ condition)
dds <- dds[rowSums(counts(dds)) >= 10, ]
# Tiny artificial dataset: mean dispersion fit avoids a fragile trend fit.
dds <- DESeq(dds, fitType = "mean")
res <- results(dds, contrast = c("condition", "Treatment", "Control"), alpha = ${S.alpha})
tab <- as.data.frame(res)
tab$pass_display_criteria <- !is.na(tab$padj) & tab$padj <= ${S.alpha} & abs(tab$log2FoldChange) >= ${S.lfc}
write.csv(tab[order(tab$padj), ], "actual_DESeq2_results.csv")
write.csv(counts(dds, normalized = TRUE), "actual_normalized_counts.csv")
# Raw counts are modeled above. Log values below are only for visualization.
pdf("actual_DESeq2_plots.pdf", width = 8, height = 6)
ok <- is.finite(tab$log2FoldChange) & !is.na(tab$padj)
if (any(ok)) {
  col <- ifelse(tab$pass_display_criteria, ifelse(tab$log2FoldChange > 0, "#cd6b56", "#4e7eac"), "#a2afb6")
  plot(tab$log2FoldChange[ok], -log10(pmax(tab$padj[ok], 1e-100)),
       pch = 19, col = col[ok], xlab = "log2 fold change: Treatment / Control",
       ylab = "-log10 adjusted P", main = "Actual DESeq2: synthetic counts")
  abline(v = c(-${S.lfc}, ${S.lfc}), h = -log10(${S.alpha}), lty = 2, col = "grey60")
}
m <- log2(counts(dds, normalized = TRUE) + 1)
rv <- apply(m, 1, var)
ids <- head(order(rv, decreasing = TRUE), 18)
ids <- ids[rv[ids] > 0]
if (length(ids) >= 2) {
  z <- t(scale(t(m[ids, , drop = FALSE])))
  heatmap(z, Rowv = NA, Colv = NA, scale = "none", margins = c(6, 9),
          col = colorRampPalette(c("#4e7eac", "#f3f5f4", "#cd6b56"))(80),
          main = "Highest variance genes: within-gene Z score")
}
dev.off()
capture.output(sessionInfo(), file = "R_sessionInfo.txt")
`}
function go(n){S.step=clamp(n,0,10);S.visited.add(S.step);render();$('#main').scrollIntoView({block:'start',behavior:'instant'})}
function setGene(i){S.gene=+i;if(S.step>=8){$('#gene-select').value=S.gene;refresh()}else insight(`${S.genes[i].id} selected. It will follow you into the plots.`)}
function setCount(j,v){v=clamp(Math.round(Number(v)||0),0,50000);S.overrides[S.gene+':'+j]=v;S.genes[S.gene].counts[j]=v;analyze();refresh()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;switch(a){case'step':go(+v);return;case'next':go((S.step+1)%11);return;case'prev':go(S.step-1);return;case'notes':notes();return;case'why':showDialog(steps[S.step][1],`<p>${why[S.step]}</p>`);return;case'close':$('#dialog').close();return;case'export':exportDialog();return;case'rna':S.rna=+v;break;case'library':S.library=+v;break;case'base-next':S.cycle=Math.min(seq.length,S.cycle+1);break;case'base-back':S.cycle=Math.max(0,S.cycle-1);break;case'base-all':S.cycle=seq.length;break;case'base-reset':S.cycle=0;break;case'base-select':S.fastBase=+v;refresh();return;case'assembly':S.assembly=+v;break;case'branch':S.repeat=!S.repeat;refresh();return;case'resolve':S.resolve=!S.resolve;refresh();return;case'skip-assembly':go(5);return;case'map-mode':S.mapMode=v;break;case'map':S.mapped=true;refresh();return;case'map-reset':S.mapped=false;refresh();return;case'count-next':{const i=toyFragments.findIndex((_,i)=>!S.counted.has(i));if(i>=0)S.counted.add(i);refresh();return}case'count-all':toyFragments.forEach((_,i)=>S.counted.add(i));refresh();return;case'count-reset':S.counted.clear();refresh();return;case'normalize':S.normalized=v==='1';break;case'select-gene':setGene(v);return;case'reset-gene':samples.forEach((_,j)=>delete S.overrides[S.gene+':'+j]);regenerate();refresh();return;case'variation-challenge':S.noise=.65;S.overrides={};regenerate();break;case'strong-challenge':S.effect=2.4;S.noise=.12;S.overrides={};regenerate();break;case'null-challenge':S.effect=0;S.noise=.2;S.overrides={};regenerate();break;case'reset-data':S.effect=1.7;S.noise=.19;S.depth=1.5;S.alpha=.05;S.lfc=1;S.overrides={};regenerate();break;case'csv':download('mock_counts.csv','gene,'+samples.join(',')+'\n'+S.genes.map(g=>g.id+','+g.counts.join(',')).join('\n')+'\n','text/csv');return;case'metadata':download('mock_samples.csv','sample,condition\n'+samples.map((s,i)=>s+','+(i<3?'Control':'Treatment')).join('\n')+'\n','text/csv');return;case'results':download('approximate_results.csv','gene,baseMean,approx_log2FC,approx_SE,approx_dispersion,approx_pvalue,approx_BH_padj,passes_display_criteria\n'+S.rows.map(r=>[r.id,r.baseMean,r.lfc,r.se,r.disp,r.p??'',r.padj??'',sig(r)].join(',')).join('\n')+'\n','text/csv');return;case'rscript':download('run_actual_DESeq2.R',rScript());return}render()});
document.addEventListener('input',e=>{const t=e.target,id=t.dataset.control;if(t.dataset.sample!==undefined){setCount(+t.dataset.sample,t.value);return}if(!id)return;if(id==='gene'){setGene(t.value);return}if(['heatMode','heatFilter'].includes(id)){S[id]=t.value;refresh();return}S[id]=+t.value;if(['effect','noise','depth'].includes(id))regenerate();if(id==='k'||id==='kpos'){S.kpos=Math.min(S.kpos,9-S.k);$('#kpos').max=9-S.k;$('#kpos').value=S.kpos;$('#out-k').textContent=S.k;$('#out-kpos').textContent=S.kpos+1;drawAssembly();return}refresh()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button][data-action]')){e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}if($('#dialog').open||e.target.matches('input,select,textarea,button'))return;if(e.key==='ArrowRight'){e.preventDefault();go(Math.min(10,S.step+1))}if(e.key==='ArrowLeft'){e.preventDefault();go(S.step-1)}});
let drag=null;
document.addEventListener('pointerdown',e=>{const bar=e.target.closest('[data-bar]');if(bar){e.preventDefault();const svgEl=bar.ownerSVGElement;drag={j:+bar.dataset.bar,max:+bar.dataset.max,matrix:svgEl.getScreenCTM().inverse()};updateDrag(e);return}if(S.step===9&&e.target.closest('#visual svg')){const el=e.target.closest('svg'),pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(el.getScreenCTM().inverse()),g=window.volcanoGeometry;let best=null,dist=Infinity;for(const r of g.plotted){const dd=Math.hypot(g.xx(r.lfc)-pt.x,g.yy(-Math.log10(r.padj))-pt.y);if(dd<dist){dist=dd;best=r}}if(best&&dist<32)setGene(best.i)}});
function updateDrag(e){if(!drag)return;const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);setCount(drag.j,(190-pt.y)/145*drag.max)}
window.addEventListener('pointermove',e=>{if(drag){e.preventDefault();updateDrag(e)}},{passive:false});window.addEventListener('pointerup',()=>drag=null);window.addEventListener('pointercancel',()=>drag=null);
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(S.step===9)drawVolcano();if(S.step===10)drawHeatmap()},120)});
regenerate();render();
</script>
